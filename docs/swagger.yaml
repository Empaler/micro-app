basePath: /
definitions:
  books.Book:
    properties:
      author:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      rating:
        type: number
      releaseYear:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
    type: object
  movies.Movie:
    properties:
      actors:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      isAdult:
        type: boolean
      rating:
        type: number
      resolution:
        $ref: '#/definitions/movies.Resolution'
      title:
        type: string
      type:
        $ref: '#/definitions/movies.MovieType'
      updatedAt:
        type: string
      year:
        type: integer
    type: object
  movies.MovieType:
    enum:
    - movie
    - series
    type: string
    x-enum-varnames:
    - MovieTypeMovie
    - MovieTypeSeries
  movies.Resolution:
    enum:
    - SD
    - HD
    - FHD
    - 4K
    type: string
    x-enum-varnames:
    - ResolutionSD
    - ResolutionHD
    - ResolutionFHD
    - Resolution4K
host: localhost:8080
info:
  contact: {}
  description: Movie and Book collection management API
  title: Movie API
  version: "1.0"
paths:
  /api/books:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List all books
      tags:
      - books
    post:
      consumes:
      - application/json
      parameters:
      - description: Book data
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/books.Book'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Create a new book
      tags:
      - books
  /api/books/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: integer
      produces:
